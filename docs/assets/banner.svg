<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#232a45"/>
      <stop offset="1" stop-color="#0e0f14"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.35" r="0.55">
      <stop offset="0" stop-color="#8ab4f8" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#8ab4f8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="24" fill="url(#glow)"/>

  <!-- soft waveform -->
  <g fill="#8ab4f8" opacity="0.13">
    <rect x="760" y="150" width="10" height="60" rx="5"/><rect x="784" y="120" width="10" height="120" rx="5"/>
    <rect x="808" y="95" width="10" height="170" rx="5"/><rect x="832" y="130" width="10" height="100" rx="5"/>
    <rect x="856" y="80" width="10" height="200" rx="5"/><rect x="880" y="110" width="10" height="140" rx="5"/>
    <rect x="904" y="140" width="10" height="80" rx="5"/><rect x="928" y="100" width="10" height="160" rx="5"/>
    <rect x="952" y="70" width="10" height="220" rx="5"/><rect x="976" y="115" width="10" height="130" rx="5"/>
    <rect x="1000" y="145" width="10" height="70" rx="5"/><rect x="1024" y="105" width="10" height="150" rx="5"/>
    <rect x="1048" y="125" width="10" height="110" rx="5"/><rect x="1072" y="155" width="10" height="50" rx="5"/>
    <rect x="1096" y="135" width="10" height="90" rx="5"/><rect x="1120" y="160" width="10" height="40" rx="5"/>
  </g>

  <!-- app icon -->
  <g transform="translate(96 112)">
    <rect width="136" height="136" rx="30" fill="#1c1d21" stroke="#ffffff" stroke-opacity="0.12"/>
    <rect x="31" y="45" width="19" height="46" fill="#8ab4f8"/>
    <rect x="59" y="30" width="19" height="76" fill="#8ab4f8"/>
    <rect x="87" y="52" width="19" height="32" fill="#8ab4f8"/>
  </g>

  <g font-family="Segoe UI Variable Display, Segoe UI, Inter, Helvetica, Arial, sans-serif">
    <text x="272" y="178" font-size="68" font-weight="700" fill="#f2f4f8" letter-spacing="-1">AmbientBar</text>
    <text x="275" y="228" font-size="26" fill="#a9b0bd">Ambient YouTube soundtracks, minus the tab.</text>
  </g>
</svg>
